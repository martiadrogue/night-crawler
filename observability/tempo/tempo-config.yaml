# Single-process Tempo keeping traces on the `tempo_data` volume.
# Fine for one host; not for a cluster.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 336h # 14 days, like Loki

usage_report:
  reporting_enabled: false
